---
major_changes:
  - >
    Add collection baseline framework — ``plugins/module_utils/_SCOMPsSetupUtils.psm1``
    provides centralised SCOM PowerShell module import and Management Group connection
    validation, shared ``plugins/doc_fragments/uses_scom_ps_module`` covers common
    notes, requirements, and authorship, and ``tests/integration/targets/prepare_tests/``
    ensures a valid SCOM auto-connection and sets common test facts before any
    integration test runs.
  - >
    Add GitHub Actions CI workflows ported from ``microsoft.mecm`` and adapted for SCOM —
    covering ansible-test integration, sanity, ansible-lint, docs build (PR preview and
    GitHub Pages publish), extra docs linting, changelog validation, and Red Hat
    Automation Hub certification checks.
  - >
    Add smart integration test target detection — a ``scripts/get_integration_targets.sh``
    script and a ``detect-changes`` CI job automatically determine which ``win_scom_*``
    targets to run based on changed files in a PR.  Module utils changes trigger a full
    run; pushes to ``main`` and ``stable-*`` always run all targets.

minor_changes:
  - >
    Add ``Makefile`` with ``integration`` and ``sanity`` targets to standardise local
    and CI test invocation, mirroring the ``microsoft.mecm`` developer workflow.
  - >
    Add ``tests/integration/requirements.txt`` (``pywinrm``) and
    ``tests/integration/requirements.yml`` (``ansible.windows``) so integration test
    dependencies are installed consistently in CI and locally.
  - >
    Add ``.pre-commit-config.yaml`` enforcing consistent code style via
    ``collection_prep update-docs``, ``prettier``, ``isort``, ``black``, ``flake8``,
    ``add-trailing-comma``, and standard file hygiene hooks.
  - >
    Add ``.flake8`` configuration setting ``max-line-length = 160`` to match the
    ``microsoft.mecm`` coding standard.
  - >
    Add ``.prettierignore`` to exclude ``README.md``, ``docs/``, and
    ``changelogs/CHANGELOG.rst`` from prettier reformatting, preventing a conflict
    loop with the ``collection_prep update-docs`` hook.
  - >
    Add ``README.md`` content anchors required by the ``collection_prep update-docs``
    pre-commit hook for automatic module table and version badge injection.
  - >
    Exclude ``extensions/eda/`` from pre-commit hooks globally to avoid false positives
    from third-party async library imports not present in the pre-commit environment.
  - >
    Delete orphaned ``.azure-pipelines/`` directory — all CI runs through GitHub Actions.
